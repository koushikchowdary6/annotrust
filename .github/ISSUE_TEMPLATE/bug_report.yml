name: Bug report
description: A wrong result, a crash, or a report that does not match the docs
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The annotrust command you ran, and the exit code.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Python version, annotrust version (`annotrust --version`), and operating system.
    validations:
      required: true
